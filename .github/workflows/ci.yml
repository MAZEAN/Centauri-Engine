name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: neither job writes anything back to the repo (build+test, and a
# screenshot artifact upload — both handled by GITHUB_TOKEN's own separate, narrower artifact
# permission, not "contents"). Set explicitly so this holds regardless of the repo's own
# GITHUB_TOKEN default setting.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR instead of letting them queue up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA, not the (mutable) v4 tag — a tag can be repointed after the fact
      # (see the tj-actions/changed-files incident, Mar 2025: a compromised maintainer token was
      # used to retag released versions at malicious commits, silently poisoning every workflow
      # that referenced them by tag). A SHA can't be reused this way. Comment notes which release
      # this currently resolves to, for humans skimming the file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Centauri-Engine.sln

      - name: Build (Release)
        run: dotnet build Centauri-Engine.sln -c Release --no-restore

      # Centauri.Tests is pure-CPU logic (CascadeBuilder, EntityHierarchyWiring,
      # MaterialRegistry, Transform — see Docs/Documentation/Testing.md) and needs no GL
      # context/display, so this runs on the same plain runner as the build.
      - name: Unit tests
        run: dotnet test Centauri.Tests/Centauri.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  headless-render-smoke-test:
    name: Headless boot & render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # xvfb (virtual display) + Mesa's llvmpipe software OpenGL driver + libglfw3, plus the
      # X11 client-side libraries GLFW needs at runtime (libx11-6/libxrandr2/etc. — kept from
      # earlier attempts as harmless, standard prerequisites even though they turned out not to
      # be the actual blocker here).
      #
      # ACTUAL ROOT CAUSE (found via CENTAURI_GLFW_DIAG, see Program.cs): the failure was never
      # X11/RandR at all -- `ldd` on the NuGet-bundled libglfw.so.3 shows it only link-time-
      # depends on libc/libm, nothing X11-related. The real error is
      # `System.IO.FileNotFoundException: Could not load from any of the possible library
      # names!` -- .NET's native-asset resolution for the NuGet-bundled
      # runtimes/linux-x64/native/libglfw.so.3 (present in the build output, confirmed locally)
      # isn't finding it on this runner, for reasons not fully root-caused (tried forcing an
      # explicit `-r linux-x64` build locally to sidestep that resolution entirely, but that
      # changes the output layout to bin/<config>/<tfm>/linux-x64/ and breaks
      # PathResolver.Resolve's fixed "go up 3 directories" assumption -- not worth that
      # regression for a CI-only workaround). Installing the system libglfw3 package instead
      # gives the native loader's OS-level dlopen fallback a real library to find, without
      # touching the build/run commands or output layout at all.
      - name: Install Xvfb + Mesa software renderer + GLFW + X11 client libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libglfw3 \
            libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libxext6

      - name: Build (Release)
        run: dotnet build Centauri-Engine.sln -c Release

      # Boots the engine exactly as configured in the checked-in Config/config.json (the real
      # default environment + entity sets, not a throwaway scene), renders a handful of frames,
      # and saves a screenshot — a crash, an unhandled exception, or a shader compile failure
      # fails this step. This depends on the repo's actual Assets/ tree being present (skybox
      # HDRIs etc.) — if a future checkout trims those (see CLAUDE.md's own note on sandboxed
      # dev environments shipping a reduced Assets/), point CENTAURI_HEADLESS_FRAMES/the
      # environment path at a minimal scene instead of skipping this job outright.
      #
      # DIAGNOSTIC IN PROGRESS: two prior fix attempts (X11 client libs, then forcing Xvfb's
      # RandR extension on) neither changed the failure — identical exception on the next run
      # both times. A follow-up attempt to switch *our* build to Debug so Silk.NET.Windowing.
      # Glfw's own `#if DEBUG` diagnostic would fire was also a dead end: that `#if DEBUG` is
      # baked into Silk.NET's own precompiled NuGet package at *their* build time (Release, like
      # any published package) — our project's build config has no effect on it. CENTAURI_GLFW_
      # DIAG=1 (see Program.cs) instead probes the same native GLFW load directly in our own
      # code, so the real exception (missing native asset vs. an unresolved transitive symbol vs.
      # something else) actually reaches this step's log — read that before changing anything
      # else here.
      - name: Headless boot + render
        env:
          CENTAURI_HEADLESS_FRAMES: '10'
          CENTAURI_SCREENSHOT_PATH: '${{ runner.temp }}/smoke-test.png'
          CENTAURI_GLFW_DIAG: '1'
        run: >
          xvfb-run -a --server-args="-screen 0 1920x1080x24 +extension RANDR +extension GLX"
          dotnet run --project Centauri/Centauri.csproj -c Release --no-build

      - name: Verify a screenshot was produced
        run: test -s "${{ runner.temp }}/smoke-test.png"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headless-smoke-test-screenshot
          path: ${{ runner.temp }}/smoke-test.png
          if-no-files-found: ignore
